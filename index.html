<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ultrasound</title><link rel="stylesheet" href="index.css"><script defer="defer" src="/ultrasound/static/js/main.e997207d.js"></script><link href="/ultrasound/static/css/main.d8685239.css" rel="stylesheet"></head><body><div id="root"><h1>Ultrasound Information</h1><div><p><strong>Player Name:</strong> <span id="playerName">Unknown</span></p><p><strong>Player ID:</strong> <span id="playerID">N/A</span></p><p><strong>Date:</strong> <span id="playerDate">N/A</span></p></div><button id="closeButton">Close</button></div><script src="main.js"></script><div id="uiContainer"><h1>Ultrasound Interface</h1><button id="closeButton">Close</button></div><div><h2>Player Details</h2><p>Name: <span id="playerName"></span></p><p>ID: <span id="playerID"></span></p></div><script>window.addEventListener("message",(function(e){if("open"===e.data.action)document.body.style.display="block";else if("close"===e.data.action)document.body.style.display="none";else if("playerInfo"===e.data.action){const t=e.data.player;document.getElementById("playerName").innerText=t.name,document.getElementById("playerID").innerText=t.id}else"error"===e.data.action&&alert(e.data.message)})),document.getElementById("closeButton").addEventListener("click",(function(){fetch(`https://${GetParentResourceName()}/closeUi`,{method:"POST"})})),document.addEventListener("keydown",(function(e){"Space"!==e.code&&"Escape"!==e.code||fetch(`https://${GetParentResourceName()}/closeUi`,{method:"POST"})}))</script></body></html>
